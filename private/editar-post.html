<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obras Viegas - Editar Publicação</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/editar-post.css">
    <link rel="stylesheet" href="/css/ui.css">
    <script src="/js/ui.js"></script>
    <script src="/js/editar-post.js" defer></script>
    <script src="/js/animations.js" defer></script>
</head>
<body class="pagina-pronta">
 <header class="app-header">
    <div class="logo">
        <h1>Obras <span>Viegas</span></h1>
    </div>   

     <div class="header-usuario">

        <span id="usuario" class="nome-usuario"></span>

        <div class="perfil-icone">
            <img
                id="fotoPerfil"
                src="/img/avatar-padrao.jpg"
                alt="Foto de perfil"
            >
        </div>

        <button
            id="btnLogout"
            class="btn-logout"
            type="button"
        >
            Sair
        </button>

    </div>
</header>

    <!-- Conteúdo Principal -->
    <main class="editar-container animacao-entrada">
        <section class="editar-card">
            
            <header class="card-header">
                <h2>Editar publicação</h2>
                <p>Atualize as informações da sua publicação no feed.</p>
            </header>

            <div id="mensagemStatus" class="mensagem-status" aria-live="polite"></div>

            <form id="formEditarPost" class="form-editar">
                
                <div class="form-group">
                    <label for="inputTitulo">Título da publicação</label>
                    <input 
                        type="text" 
                        id="inputTitulo" 
                        name="titulo" 
                        placeholder="Ex: Pedreiro e Azulejista ou Preciso de servente" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="selectTipo">Tipo da publicação</label>
                    <select id="selectTipo" name="tipo" required>
                        <option value="servico">Oferecer serviço</option>
                        <option value="pedido">Pedir ajuda / Obra</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="selectBairro">Bairro</label>
                    <select id="selectBairro" name="bairro" required>
                        <option value="">Selecione o bairro</option>
                        <option value="Bangu">Bangu</option>
                        <option value="Santíssimo">Santíssimo</option>
                        <option value="Senador Camará">Senador Camará</option>
                        <option value="Viegas">Viegas</option>
                        <option value="Padre Miguel">Padre Miguel</option>
                        <option value="Realengo">Realengo</option>
                        <option value="Outro">Outro bairro</option>
                    </select>

                    <input
                        type="text"
                        id="inputOutroBairro"
                        name="outroBairro"
                        placeholder="Digite o nome do bairro"
                        class="campo-outro-bairro"
                    >
                </div>

                <div class="form-group">
                    <label for="textareaDescricao">Descrição</label>
                    <textarea 
                        id="textareaDescricao" 
                        name="descricao" 
                        placeholder="Descreva os detalhes do serviço, experiência ou orçamento..." 
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="inputWhatsapp">WhatsApp de contato</label>
                    <input 
                        type="tel" 
                        id="inputWhatsapp" 
                        name="whatsapp" 
                        placeholder="(21) 99999-9999" 
                        required
                    >
                </div>

                <div class="botoes-grupo">
                    <button type="submit" id="btnSalvar" class="btn-salvar">Salvar alterações</button>
                    <a href="/main" id="btnCancelar" class="btn-cancelar">Cancelar</a>
                </div>

            </form>

        </section>
    </main>

    <!-- Bottom Nav Padronizada com SVGs -->
    <nav class="bottom-nav">
        <a href="/main" class="nav-item">
            <svg class="nav-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
            <span>Início</span>
        </a>

        <a href="/buscar" class="nav-item">
            <svg class="nav-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Buscar</span>
        </a>

        <a href="/postar" class="nav-item btn-destaque" aria-label="Criar publicação">+</a>

        <a href="/perfil" class="nav-item">
            <svg class="nav-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Perfil</span>
        </a>
    </nav>

</body>
</html>
