<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Obras Viegas - Editar Perfil</title>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/editar-perfil.css">

    <script src="/js/animations.js" defer></script>
    <script src="/js/editar-perfil.js" defer></script>
</head>

<body>

    <!-- Cabeçalho -->
    <header class="app-header">

        <div class="logo">
            <h1>Obras <span>Viegas</span></h1>
        </div>

    </header>


    <!-- Conteúdo principal -->
    <main class="editar-perfil-container">

        <!-- Apresentação -->
        <section class="editar-perfil-topo">

            <p class="editar-perfil-kicker">
                Minha conta
            </p>

            <h2>
                Editar perfil
            </h2>

            <p>
                Atualize suas informações pessoais.
            </p>

        </section>


        <!-- Formulário -->
        <section class="editar-perfil-card">

            <form id="formEditarPerfil">

               <div class="foto-perfil-container">

    <div class="foto-perfil-preview">
      <img
    id="previewFoto"
    alt="Foto de perfil"
>
    </div>

    <label for="inputFoto" class="btn-escolher-foto">
        Escolher foto
    </label>

    <input
        type="file"
        id="inputFoto"
        accept="image/*"
        hidden
    >

    <p class="foto-perfil-info">
        Escolha uma foto para o seu perfil.
    </p>

</div>

                <!-- Nome -->
                <div class="form-grupo">

                    <label for="inputNome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="inputNome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <!-- E-mail -->
                <div class="form-grupo">

                    <label for="inputEmail">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="inputEmail"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <!-- Mensagem de status -->
                <p
                    id="mensagemPerfil"
                    class="mensagem-perfil"
                    aria-live="polite"
                ></p>


                <!-- Ações -->
                <div class="editar-perfil-acoes">

                    <a
                        href="/perfil"
                        class="btn-cancelar"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn-salvar"
                    >
                        Salvar alterações
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- Navegação inferior -->
    <nav class="bottom-nav">

        <a href="/main" class="nav-item">

            <svg
                class="nav-icone"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path
                    d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                ></path>
            </svg>

            <span>Início</span>

        </a>


        <a href="/buscar" class="nav-item">

            <svg
                class="nav-icone"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <circle cx="11" cy="11" r="8"></circle>

                <line
                    x1="21"
                    y1="21"
                    x2="16.65"
                    y2="16.65"
                ></line>
            </svg>

            <span>Buscar</span>

        </a>


        <a
            href="/postar"
            class="nav-item btn-destaque"
            aria-label="Criar publicação"
        >
            +
        </a>


        <a href="/perfil" class="nav-item ativo">

            <svg
                class="nav-icone"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path
                    d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                ></path>

                <circle cx="12" cy="7" r="4"></circle>
            </svg>

            <span>Perfil</span>

        </a>

    </nav>

</body>

</html>
