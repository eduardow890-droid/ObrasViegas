<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Obras do Viegas</title>
    <link rel="stylesheet" href="/css/cadastro.css">
    <link rel="stylesheet" href="/css/ui.css">
</head>
<body>

    <div class="conteiner">
        <!-- Logo integrada ao card -->
        <img id="logo" src="logo-escura.png" alt="Obras Viegas">

        <div class="header-app">
            <p>Crie sua conta e encontre serviços no bairro</p>
        </div>

        <form id="formCadastro">
            <input type="text" id="nomeUsuario" name="nome" placeholder="Digite seu nome completo" required>
            <input type="email" id="emailCadastro" name="email" placeholder="Insira seu e-mail" required>
            <input type="password" id="senhaCadastro" name="senha" placeholder="Crie sua senha" required>
            
            <button type="submit">Finalizar Cadastro</button>
            <a href="/index.html" class="btn-voltar-login">Já tem uma conta? Faça login</a>
        </form>
    </div>
    <script src="/js/ui.js"></script>
    <script src="/js/cadastro.js"></script>
</body>
</html>
