<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Obras do Viegas</title>
    <link rel="stylesheet" href="/css/cadastro.css">
</head>
<body>
    <div class="conteiner">
        <div class="header-app">
        <h1>Obras do Viegas</h1>
        <p>Crie sua conta e encontre serviços no bairro</p>
    </div>
        <form action="/cadastrar" method="post" id="formCadastro">
            <input type="text" id="nomeUsuario" placeholder="Digite seu nome completo">
            <input type="email" id="emailCadastro" placeholder="Insira seu email">
            <input type="password" id="senhaCadastro" placeholder="Crie sua senha">
            <button type="submit">Finalizar Cadastro</button>
        </form>

    </div>
    <script src="/js/cadastro.js"></script>
</body>
</html>
